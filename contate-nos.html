<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Contate-nos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            background: #111118;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #7b00ff;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #9d4edd;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #9d4edd;
        }

        main {
            padding: 60px 10%;
        }

        h1 {
            text-align: center;
            color: #9d4edd;
            margin-bottom: 30px;
        }

        form {
            max-width: 600px;
            margin: auto;
            background: #16161f;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #0b0b0f;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }

        textarea {
            height: 150px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #7b00ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #a64dff;
        }

        footer {
            margin-top: 80px;
            padding: 30px;
            text-align: center;
            background: #08080c;
            color: #999;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">🎮 GameZone</div>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="contate-nos.html">Contate-nos</a></li>
            <li><a href="parceiros.html">Parceiros</a></li>
            <li><a href="servicos.html">Serviços</a></li>
            <li><a href="sobre.html">Sobre</a></li>
        </ul>
    </nav>

</header>

<main>

    <h1>📞 Contate-nos</h1>

    <form>

        <input type="text" placeholder="Seu nome" required>

        <input type="email" placeholder="Seu e-mail" required>

        <textarea placeholder="Digite sua mensagem"></textarea>

        <button type="submit">
            Enviar mensagem
        </button>

    </form>

</main>

<footer>
    © 2026 GameZone
</footer>

</body>
</html>
